[project]
name = "amazon-product-intelligence-contracts"
version = "0.1.0"
description = "Provider-neutral canonical evidence contracts for the Amazon product intelligence system"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "rapidfuzz>=3.14,<4",
]

[project.optional-dependencies]
buyer-probe = ["playwright>=1.55,<2"]

[project.scripts]
amazon-intel = "amazon_product_intelligence.production_pipeline.cli:main"
amazon-buyer-probe = "amazon_product_intelligence.buyer_context_probe:main"
amazon-market-pds = "amazon_product_intelligence.market_pds_workflow:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["amazon_product_intelligence*"]

[tool.setuptools.package-data]
"amazon_product_intelligence.production_pipeline" = ["fixtures/*.json"]
"amazon_product_intelligence.batch_product_selection" = ["templates/*.mjs"]
"amazon_product_intelligence.market_report.v0_3" = ["renderer.mjs"]
